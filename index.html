<style>

  border:1px solid rgba(90,209,255,0.45); border-radius:8px; padding:5px 10px; cursor:pointer; }
.fw-ctl .fw-z { display:none; min-width:34px; }

.viz-screen.fw-fs { border:0; border-radius:0; }

.viz-pop { position:absolute; z-index:2; box-sizing:border-box; width:max-content; max-width:min(330px, calc(100% - 16px)); background:rgba(9,8,22,0.95);
  border:1px solid rgba(90,209,255,0.45); border-radius:8px; padding:10px 12px; color:#e6ecff;
  font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; box-shadow:0 6px 24px rgba(0,0,0,0.55); }
.viz-pop { opacity:0; visibility:hidden; pointer-events:none; transform:scale(0.84);
  transition:opacity .16s ease, transform .2s cubic-bezier(.3,.7,.4,1), visibility 0s linear .2s; }
.viz-pop.open { opacity:1; visibility:visible; pointer-events:auto; transform:none;
  transition:opacity .16s ease, transform .24s cubic-bezier(.2,.9,.3,1.15), left .22s ease, top .22s ease, visibility 0s; }
@media (prefers-reduced-motion: reduce) { .viz-pop, .viz-pop.open { transform:none;
  transition:opacity .1s linear, visibility 0s linear .1s; } }
.viz-x { position:absolute; top:3px; right:4px; border:none; background:none; color:#9fb3ff; font-size:17px; line-height:1;
  padding:3px 7px; cursor:pointer; }
.vp-t { color:#5ad1ff; font-weight:700; margin:0 24px 6px 0; }
.vp-r { display:flex; gap:10px; margin:3px 0; } .vp-k { flex:none; width:112px; color:#8f96c0; }
.vp-v { flex:1; min-width:120px; overflow-wrap:anywhere; }
.vp-bar { display:block; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:3px; overflow:hidden; }
.vp-bar > span { display:block; height:100%; }
.vp-h { color:#8f96c0; margin:8px 0 2px; } .vp-j { margin:5px 0 0; } .vp-n { color:#a9b0d6; margin:2px 0 0; overflow-wrap:anywhere; }
.vp-warn { color:#f6bf60; font-weight:400; }
.viz-screen { position:relative; }
.viz[data-view="proj"] #fw-canvas { opacity:0.22; filter:blur(1px); pointer-events:none; }
.viz[data-view="proj"] #fw-pop, .viz[data-view="proj"] #fw-ctl, .viz[data-view="proj"] #pv,
.viz[data-view="proj"] #detail { display:none !important; }
.proj { position:absolute; inset:0; overflow:auto; z-index:5; }
.proj[hidden], #tab-project[hidden] { display:none; }
.proj-inner { max-width:760px; margin:0 auto; padding:22px 20px 32px; box-sizing:border-box; }
.proj-title { margin:0 0 10px; font-size:20px; font-weight:600; }

.proj-steps span { flex:1; height:7px; border-radius:4px; background:#2c2c3c; overflow:hidden; }
.proj-steps span i { display:block; height:100%; background:var(--run); }
.proj-steps span.done i { background:#7d8bb0; }
.proj-part { border-top:1px solid var(--line); padding:9px 0; }
.proj-part summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:10px; }
.proj-part summary::-webkit-details-marker { display:none; }
.proj-name { font-weight:600; font-size:15px; }
.proj-tag { font-size:12px; color:var(--muted); white-space:nowrap; }
.proj-tag.current { color:var(--run); }
.proj-part ul { margin:7px 0 2px; padding-left:20px; }
.proj-part li { margin:4px 0; font-size:14px; }
.proj-part li.planned { color:var(--muted); }
.proj-part li .st { font-size:12px; color:var(--muted); margin-left:7px; }
.proj-part li.running .st { color:var(--run); }
.proj-foot { font-size:12px; color:var(--muted); margin:12px 0 0; }
.proj-dates { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; gap:4px 12px; align-items:baseline;
  margin:0 0 14px; font-size:13px; }
.proj-dates[hidden] { display:none; }
.proj-dates .k { color:var(--muted); min-width:0; } .proj-dates .v { text-align:right; } .proj-dates .d { white-space:nowrap; }
.proj-dates .r { display:block; white-space:nowrap; color:var(--muted); font-size:11px; }
.proj-dates .b { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:0 6px; white-space:nowrap; }
.proj-hd { display:flex; flex-direction:column; min-width:0; }
.proj-when { font-size:12px; color:var(--run); margin-top:1px; }
.proj-part li .w { color:var(--run); }
@media (max-width:560px) { .proj-inner { padding:14px 12px 24px; }
  .proj-dates { grid-template-columns:minmax(0, 1fr) auto; gap:1px 10px; } .proj-dates .k { grid-column:1 / -1; margin-top:4px; }
  .proj-dates .v { text-align:left; } }

.viz { position:relative; top:auto; width:100%; max-width:none; min-width:0; flex:none; }
.viz-bar { display:none; }
.viz-tabs { align-items:center; flex-wrap:wrap; }
.viz-tabs button { flex:0 0 auto; min-width:120px; }
.pub-note { margin-left:auto; color:var(--muted); font-size:12px; }
.viz-screen { height:calc(100vh - 62px); min-height:380px; }
@media (max-width:560px) { .pub-note { margin-left:0; width:100%; } .viz-screen { height:calc(100vh - 86px); } }
</style>
<style>
/* BEGIN processing_view.css */
/* processing_view.css: the Processing view's shared style. Scoped to .pv and .detail; made by tools/make_renderer.py. */
/* ---------------------------------------------------------------------------------------------------------------
   Processing view (prototype A, version 2, approved 2026-10-12): the picture and the dashboard together.
   One visual language for both. A measured quantity is a track (a hairline with a fill) or its circular twin, a ring;
   thread load is a comb, or the same comb wrapped round a hub as spokes. Color means state only: gray is hardware
   load, blue is work moving, amber is check or needs you, red is a problem. Motion only where something real moves.
   --------------------------------------------------------------------------------------------------------------- */
.pv, .detail {
  color-scheme: dark;
  --bg: #0f1216; --panel: #151a20; --raise: #1b2129; --line: #252c35; --line-2: #333c47;
  --ink: #e8ecf1; --ink-2: #aeb7c2; --ink-3: #848f9c;
  --track: #232a33; --meter: #b4bcc6;
  --work: #3a9ad6; --work-track: #17324a; --work-glow: rgba(58,154,214,.55);
  --warn: #e3a130; --warn-bg: rgba(227,161,48,.10); --warn-line: rgba(227,161,48,.55);
  --gold: #e8c25a;
  --bad: #e5564f; --bad-bg: rgba(229,86,79,.12); --bad-line: rgba(229,86,79,.6);
  --on-status: #0f1216; --shadow: 0 12px 40px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  .pv:not([data-theme="dark"]), .detail:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --raise: #f0f2f5; --line: #e1e5ea; --line-2: #cdd3da;
  --ink: #12161b; --ink-2: #48515d; --ink-3: #66707c;
  --track: #e4e8ec; --meter: #5f6874;
  --work: #1679b8; --work-track: #d3e6f3; --work-glow: rgba(22,121,184,.4);
  --warn: #c48400; --warn-bg: rgba(196,132,0,.09); --warn-line: rgba(196,132,0,.55);
  --gold: #a87a00;
  --bad: #cc3333; --bad-bg: rgba(204,51,51,.08); --bad-line: rgba(204,51,51,.5);
  --on-status: #ffffff; --shadow: 0 12px 40px rgba(20,30,40,.18);
}
}
.pv[data-theme="light"], .detail[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --raise: #f0f2f5; --line: #e1e5ea; --line-2: #cdd3da;
  --ink: #12161b; --ink-2: #48515d; --ink-3: #66707c;
  --track: #e4e8ec; --meter: #5f6874;
  --work: #1679b8; --work-track: #d3e6f3; --work-glow: rgba(22,121,184,.4);
  --warn: #c48400; --warn-bg: rgba(196,132,0,.09); --warn-line: rgba(196,132,0,.55);
  --gold: #a87a00;
  --bad: #cc3333; --bad-bg: rgba(204,51,51,.08); --bad-line: rgba(204,51,51,.5);
  --on-status: #ffffff; --shadow: 0 12px 40px rgba(20,30,40,.18);
}
/* Everything below is scoped to the renderer (.pv, .detail), so the host page's own rules and these never meet.
   :where() keeps the resets at the weight of a bare element selector, so any class rule here still wins. */
:where(.pv, .detail), :where(.pv, .detail) *, :where(.pv, .detail) *::before, :where(.pv, .detail) *::after { box-sizing: border-box; }
:where(.pv, .detail) [hidden] { display: none !important; }
.pv, .detail { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; color: var(--ink); }
:where(.pv, .detail) button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; margin: 0;
  min-width: 0; text-align: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:where(.pv, .detail) button:focus-visible, :where(.pv, .detail) a:focus-visible { outline: 2px solid var(--work); outline-offset: 2px; border-radius: 6px; }
:where(.pv) [aria-current="true"] { outline: 2px solid var(--ink-2); outline-offset: 2px; }
.pv .pv-num { font-variant-numeric: tabular-nums; }

/* ---- the page: a query container, so it adapts to the box it is embedded in, not to the screen ---- */
/* the renderer fills its host's box (the side panel) and scrolls inside it */
.pv-host { container: pvhost / inline-size; }
.pv { container: pv / inline-size; position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; background: var(--bg); }
.pv-host .pv .title { display: none; }  /* the host's tab already names the view */
.pv-in { font-size: clamp(13px, 0.42cqi + 9.5px, 17px); line-height: 1.35; max-width: 2200px; margin: 0 auto;
  padding: 10px 16px 28px; }
.pv.held .cols, .pv.held .pic { opacity: .5; }

/* header: what this is, how fresh the data is, and the clock the figures are measured against */
.head { display: flex; align-items: center; gap: .5em .9em; flex-wrap: wrap; padding: .2em 0 .7em; border-bottom: 1px solid var(--line); }
.title { font-weight: 650; font-size: 1.12em; letter-spacing: .01em; }
.badge { font-size: .7em; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); border: 1px solid var(--line-2);
  border-radius: 999px; padding: .12em .65em; font-weight: 650; }
.feed { display: inline-flex; align-items: center; gap: .45em; color: var(--ink-2); font-size: .85em; }
.feed .dot { width: .55em; height: .55em; border-radius: 50%; background: var(--ink-2); flex: none; }
.feed[data-level="warn"] .dot { background: var(--warn); } .feed[data-level="bad"] .dot { background: var(--bad); }
.clock { margin-left: auto; color: var(--ink-2); font-size: .9em; font-variant-numeric: tabular-nums; }

/* tier 1: what needs the operator */
.attn { margin: .85em 0 1.15em; }
.attn-ok { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em .7em; padding: .15em 0; }
.attn-ok .pv-ok { font-weight: 650; font-size: 1.12em; display: inline-flex; align-items: center; gap: .4em; }
.attn-ok .pv-ok .ic { color: var(--ink-2); }
.attn-sum { color: var(--ink-2); font-size: .92em; }
.attn-h { display: flex; align-items: baseline; gap: .7em; margin: 0 0 .5em; }
.attn-h { flex-wrap: wrap; }
.attn-h b { font-size: 1.12em; font-weight: 650; white-space: nowrap; }
.attn-more { display: block; width: 100%; padding: .45em .8em; border-radius: 9px; border: 1px dashed var(--line-2); color: var(--ink-2); font-size: .9em; text-align: left; }
.attn-h span { color: var(--ink-2); font-size: .9em; }
.alert { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: .1em .7em; width: 100%;
  padding: .6em .8em; margin: 0 0 .45em; border-radius: 9px; border: 1px solid; }
.alert[data-level="bad"] { background: var(--bad-bg); border-color: var(--bad-line); }
.alert[data-level="warn"] { background: var(--warn-bg); border-color: var(--warn-line); }
.alert .ic { width: 1.15em; height: 1.15em; grid-row: span 2; }
.alert[data-level="bad"] .ic { color: var(--bad); } .alert[data-level="warn"] .ic { color: var(--warn); }
.alert-t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.alert-t em { font-style: normal; font-weight: 650; font-size: .78em; letter-spacing: .07em; text-transform: uppercase; margin-right: .5em; }
.alert[data-level="bad"] .alert-t em { color: var(--bad); } .alert[data-level="warn"] .alert-t em { color: var(--warn); }
.alert-s { color: var(--ink-2); font-size: .88em; grid-column: 2; min-width: 0; overflow-wrap: anywhere; }
.alert .go { grid-row: 1 / span 2; grid-column: 3; color: var(--ink-3); font-size: 1.2em; }
.alert.new .ic { animation: callout 1.1s ease-in-out 3; }
@keyframes callout { 50% { transform: scale(1.25); } }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; flex: none; }

/* columns: priority order down the page; on a wide box the lower tiers move to a narrower right column */
.cols { display: grid; grid-template-columns: minmax(0,1fr); gap: 0 2.2em; }
@container dash (min-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 2.15fr) minmax(300px, 1fr); }
  .col-b { border-left: 1px solid var(--line); padding-left: 2.2em; }
}
.sec { margin: 0 0 1.7em; }
.sec-h { display: flex; align-items: baseline; gap: .6em; margin: 0 0 .6em; font-size: .72em; font-weight: 650;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.sec-h .n { letter-spacing: 0; text-transform: none; font-weight: 500; }
.col-b .sec { font-size: .94em; }
.pv-muted { color: var(--ink-3); }

/* the track: the one measuring mark used everywhere */
.meter { display: block; position: relative; height: 4px; border-radius: 2px; background: var(--track); margin-top: .35em; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--meter); transition: width .8s ease-out; }
.meter[data-level="warn"] > i { background: var(--warn); } .meter[data-level="bad"] > i { background: var(--bad); }
.meter[data-level="watch"] > i { background: var(--ink); }
.pv-cap .watch { font-size: .82em; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.meter[data-tone="work"] > i { background: var(--work); }
.meter > b { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-3); border-radius: 1px; }
.meter.tall { height: 6px; border-radius: 3px; } .meter.tall > i { border-radius: 3px; }

/* tier 2: machines */
.machines { display: grid; gap: .75em; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14em), 1fr)); }
.mc { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
.mc[data-level="warn"] { border-color: var(--warn-line); box-shadow: inset 3px 0 0 var(--warn); }
.mc[data-level="bad"] { border-color: var(--bad-line); box-shadow: inset 3px 0 0 var(--bad); }
.mc-main { display: block; width: 100%; padding: .65em .8em .55em; border-radius: 10px 10px 0 0; }
.mc-head { display: flex; align-items: baseline; gap: .55em; min-width: 0; }
.mc-name { font-weight: 650; font-size: 1.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-sub { color: var(--ink-2); font-size: .8em; white-space: nowrap; }
.fresh { margin-left: auto; display: inline-flex; align-items: center; gap: .35em; color: var(--ink-3); font-size: .78em;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.fresh i { width: .5em; height: .5em; border-radius: 50%; background: var(--ink-2); }
.mc[data-signal="lost"] .fresh { color: var(--bad); font-weight: 600; } .mc[data-signal="lost"] .fresh i { background: var(--bad); }
.mc[data-signal="lost"] .mts, .mc[data-signal="lost"] .comb { opacity: .4; }
.mts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .3em .7em; margin: .5em 0 .6em; }
.mt { display: block; min-width: 0; }
.mt-l { display: block; font-size: .68em; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mt-v { display: block; font-size: 1.3em; font-weight: 600; line-height: 1.15; white-space: nowrap; }
.mt-v small { font-size: .6em; font-weight: 500; color: var(--ink-2); margin-left: .1em; }
.comb { display: flex; align-items: stretch; gap: 2px; height: 2.1em; }
.comb i { flex: 1 1 0; min-width: 1px; position: relative; overflow: hidden; background: var(--track); border-radius: 1px; }
.comb b { position: absolute; inset: 0; background: var(--meter); transform-origin: 50% 100%; transform: scaleY(0);
  transition: transform .8s ease-out; }
.comb i.own b { background: var(--work); }
.comb i.own.inf b { opacity: .5; }
.comb-key { display: flex; flex-wrap: wrap; gap: .1em .9em; margin-top: .4em; font-size: .78em; color: var(--ink-2); }
.sw { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: .35em; vertical-align: -.04em; background: var(--meter); }
.sw.own { background: var(--work); }
.sw.own.inf { opacity: .5; }
.mc-jobs { display: flex; flex-wrap: wrap; gap: .2em .5em; padding: .45em .8em .55em; border-top: 1px solid var(--line); font-size: .86em; }
.mc-jobs button { display: inline-flex; align-items: center; gap: .4em; padding: .15em .1em; min-height: 1.9em; }
.mc-jobs button::before { content: ""; width: .28em; height: 1em; border-radius: 1px; background: var(--work); flex: none; }
.mc-jobs button[data-level="warn"]::before { background: var(--warn); } .mc-jobs button[data-level="bad"]::before { background: var(--bad); }
.mc-jobs .none { color: var(--ink-3); padding: .15em 0; min-height: 1.9em; display: inline-flex; align-items: center; }

@container dash (max-width: 559px) {  /* a phone, or a narrow side panel: the same blocks, tighter, so tiers 1 to 3 fit one screen */
  .mc-main { padding: .55em .7em .45em; }
  .mts { margin: .35em 0 .45em; gap: .2em .6em; }
  .mt-v { font-size: 1.15em; }
  .meter { margin-top: .25em; }
  .comb { height: 1.45em; }
  .comb-key { margin-top: .3em; }
  .mc-jobs { padding: .3em .7em .35em; }
  .mc-jobs button, .mc-jobs .none { min-height: 1.7em; }
  .machines { gap: .55em; }
  .attn { margin: .6em 0 .9em; }
  .sec { margin-bottom: 1.4em; }
}

/* tier 3: running work */
.job { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 0 0 .7em; }
.job[data-level="warn"] { border-color: var(--warn-line); box-shadow: inset 3px 0 0 var(--warn); }
.job[data-level="bad"] { border-color: var(--bad-line); box-shadow: inset 3px 0 0 var(--bad); }
.job-main { display: block; width: 100%; padding: .7em .9em .65em; border-radius: 10px; }
.job-top { display: flex; align-items: baseline; gap: .7em; }
.job-name { flex: 1; min-width: 0; font-weight: 650; font-size: 1.08em; overflow-wrap: anywhere; }
.job-state { display: none; font-weight: 650; font-size: .74em; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.job[data-level="warn"] .job-state { display: inline-flex; gap: .35em; align-items: center; color: var(--warn); }
.job[data-level="bad"] .job-state { display: inline-flex; gap: .35em; align-items: center; color: var(--bad); }
.job-pct { font-size: 1.95em; font-weight: 600; line-height: 1; white-space: nowrap; }
.job-pct small { font-size: .5em; color: var(--ink-2); font-weight: 500; margin-left: .05em; }
.prog { display: block; position: relative; height: 8px; border-radius: 4px; background: var(--work-track); margin: .55em 0 .5em; }
.prog > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--work); transition: width 1.2s ease-out; }
.job[data-level="bad"] .prog > i { background: var(--bad); } .job[data-level="bad"] .prog { background: var(--bad-bg); }
.prog.none { background: var(--track); }
.job.bump .prog > i { animation: bump 1.8s ease-out; }
@keyframes bump { 0% { box-shadow: 0 0 0 0 var(--work-glow); } 25% { box-shadow: 0 0 0 5px var(--work-glow); } 100% { box-shadow: 0 0 0 9px transparent; } }
.job-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .2em 1.2em; color: var(--ink-2); font-size: .92em; }
.job-meta strong { color: var(--ink); font-weight: 650; }
.eta { display: inline-flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-end; gap: 0 .4em; text-align: right; }
.eta-l { color: var(--ink-2); }
.eta strong { white-space: nowrap; }
.eta-n { flex-basis: 100%; font-size: .86em; color: var(--ink-3); }
.job-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .35em 1.2em; margin-top: .4em;
  color: var(--ink-2); font-size: .82em; }
.tput { display: inline-flex; align-items: center; gap: .55em; }
.tput svg { width: 8.5em; height: 1.25em; display: block; overflow: visible; }
.tput rect { fill: var(--work); } .tput rect.new { animation: tick 1.6s ease-out; }
.tput line { stroke: var(--line-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
@keyframes tick { 0% { fill: var(--ink); } 100% { fill: var(--work); } }
.queued { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em .9em; font-size: .86em; color: var(--ink-2); padding: .1em .1em 0; }
.queued .q-h { font-size: .84em; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.queued button { padding: .2em 0; min-height: 1.9em; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: .2em; }
.empty { color: var(--ink-3); padding: .3em 0 .2em; }

/* tier 4: what just finished */
.fin { display: grid; grid-template-columns: 4.6em minmax(0,1fr) auto; align-items: baseline; gap: .1em .7em; width: 100%;
  padding: .42em 0; border-top: 1px solid var(--line); font-size: .92em; }
.fin:first-child { border-top: 0; }
.fin-when { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fin-what { min-width: 0; overflow-wrap: anywhere; }
.fin-what span { display: block; color: var(--ink-3); font-size: .86em; }
.fin-where { color: var(--ink-3); font-size: .86em; white-space: nowrap; }
.fin[data-age="day"] .fin-when { color: var(--ink); font-weight: 600; }
.fin[data-age="old"] { opacity: .78; }
.fin.arrive { animation: arrive 2.6s ease-out; }
@keyframes arrive { 0% { background: var(--work-track); } 100% { background: transparent; } }
.week { display: block; width: 100%; margin-top: .7em; padding: .3em 0 0; }
.finwrap { display: grid; grid-template-columns: minmax(0,1fr); gap: 0 2.2em; align-items: start; }
@container dash (min-width: 1300px) { .finwrap { grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); } .finwrap .week { margin-top: 0; } }
.wk-row { display: grid; grid-template-columns: 4.6em minmax(0,1fr); align-items: center; gap: .7em; height: 1.35em; }
.wk-l { font-size: .74em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-row svg { width: 100%; height: 1em; display: block; }
.wk-row line.tk { stroke: var(--ink-2); stroke-width: 2; vector-effect: non-scaling-stroke; }
.wk-row line.tk.day { stroke: var(--ink); }
.wk-row line.gd { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.wk-axis { position: relative; margin-left: 5.3em; height: 1.3em; font-size: .7em; color: var(--ink-3); }
.wk-axis span { position: absolute; top: .2em; transform: translateX(-50%); white-space: nowrap; }
.wk-axis span.now { transform: translateX(-100%); }

/* tier 5: reviewers, models, budget, account limits */
.seg { display: flex; gap: 2px; height: 10px; margin: .2em 0 .45em; }
.seg i { flex: 1; border-radius: 2px; background: var(--track); }
.seg i[data-s="reviewing"] { background: var(--work); }
.seg i[data-s="returned"] { background: var(--meter); }
.seg i[data-s="invited"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.rv { display: block; width: 100%; }
.rv-n { display: flex; flex-wrap: wrap; gap: .1em .9em; font-size: .9em; color: var(--ink-2); }
.rv-n b { color: var(--ink); font-weight: 650; }
.pw { display: block; width: 100%; padding: .4em 0; border-top: 1px solid var(--line); font-size: .9em; }
.pw span { display: block; color: var(--ink-3); font-size: .88em; }
.mg { display: grid; grid-template-columns: 4.6em minmax(0,1fr); gap: .2em .7em; align-items: start; margin-bottom: .25em; }
.mg-h { font-size: .74em; color: var(--ink-3); padding-top: .5em; }
.mdl { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: baseline; gap: .55em; width: 100%;
  padding: .3em 0; font-size: .9em; min-height: 2em; }
.mdl-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdl-s { color: var(--ink-2); font-size: .9em; white-space: nowrap; }
.mdl[data-s="up"] .mdl-s { color: var(--ink); font-weight: 600; }
.mdl[data-s="error"] .mdl-s { color: var(--bad); font-weight: 650; }
.lamp { width: .62em; height: .62em; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1.5px var(--ink-3); flex: none; }
.lamp[data-s="up"] { background: var(--work); box-shadow: none; }
.lamp[data-s="loading"] { background: linear-gradient(90deg, var(--work) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--work); }
.lamp[data-s="idle"] { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.lamp[data-s="error"] { background: var(--bad); box-shadow: none; }
.bgt { display: block; width: 100%; }
.bgt-top { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; flex-wrap: wrap; }
.bgt-top b { font-size: 1.15em; font-weight: 600; }
.bgt-note { display: block; color: var(--ink-2); font-size: .86em; margin-top: .4em; }
.pv-cap { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 .7em; align-items: baseline; width: 100%; padding: .3em 0; font-size: .9em; }
.pv-cap .meter { grid-column: 1 / -1; margin-top: .25em; }

/* the details panel: a drawer on wide screens, a bottom sheet on narrow ones */
.detail { position: absolute; z-index: 30; display: flex; flex-direction: column; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 14px; line-height: 1.4; }
.detail[hidden] { display: none; }
@container pvhost (min-width: 640px) { .detail { top: 8px; right: 8px; bottom: 8px; width: min(410px, calc(100% - 16px)); border-radius: 12px; } }
@container pvhost (max-width: 639.98px) { .detail { left: 0; right: 0; bottom: 0; max-height: 84%; border-radius: 14px 14px 0 0;
  padding-bottom: env(safe-area-inset-bottom); } }
.d-bar { display: flex; align-items: center; gap: .4em; padding: .7em .6em .6em .9em; border-bottom: 1px solid var(--line); }
.d-bar h3 { flex: 1; margin: 0; font-size: 1.05em; font-weight: 650; min-width: 0; overflow-wrap: anywhere; }
.d-bar button { min-width: 2.4em; min-height: 2.4em; border-radius: 8px; color: var(--ink-2); font-size: 1.05em; }
.d-bar button:hover { background: var(--raise); }
.d-body { overflow: auto; padding: .7em .9em 1.2em; overscroll-behavior: contain; }
.d-sub { color: var(--ink-2); margin: 0 0 .7em; overflow-wrap: anywhere; }
.d-h { font-size: .72em; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 1.1em 0 .4em; }
.dr { display: grid; grid-template-columns: 8.2em minmax(0,1fr); gap: .1em .8em; padding: .32em 0; border-top: 1px solid var(--line); }
.dr:first-child { border-top: 0; }
.dk { color: var(--ink-3); } .dv { min-width: 0; overflow-wrap: anywhere; }
.dv .meter { margin-top: .4em; }
.d-note { color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; margin: .4em 0; }
.d-link { display: block; width: 100%; padding: .45em 0; border-top: 1px solid var(--line); }
.d-link span { display: block; color: var(--ink-3); font-size: .9em; }
.d-chip { display: inline-flex; align-items: center; gap: .35em; font-weight: 650; font-size: .78em; letter-spacing: .07em; text-transform: uppercase; }
.d-chip[data-level="bad"] { color: var(--bad); } .d-chip[data-level="warn"] { color: var(--warn); } .d-chip[data-level="ok"] { color: var(--ink-2); }
.d-chip[data-level="work"] { color: var(--work); }
.pv-spark { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .1em .6em; align-items: end; margin: .25em 0 .1em; }
.pv-spark svg { width: 100%; height: 34px; display: block; }
.pv-spark polyline { fill: none; stroke: var(--meter); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.pv-spark line { stroke: var(--line-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pv-spark line.th { stroke: var(--warn); stroke-dasharray: none; opacity: .7; }
.pv-spark .rng { font-size: .78em; color: var(--ink-3); text-align: right; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tgrid { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 3px; }
.tc { position: relative; display: block; height: 2.5em; border-radius: 4px; background: var(--track); overflow: hidden; font-size: .78em;
  font-variant-numeric: tabular-nums; }
.tc::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 100%); background: var(--meter); opacity: .55; }
.tc.own::before { background: var(--work); opacity: .8; }
.tc.own.inf::before { opacity: .4; }
.tc span { position: relative; display: block; text-align: center; line-height: 2.5em; color: var(--ink); font-weight: 600; }
.d-tput svg { width: 100%; height: 44px; display: block; }
.d-tput rect { fill: var(--work); } .d-tput line { stroke: var(--line-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.d-axis { display: flex; justify-content: space-between; font-size: .78em; color: var(--ink-3); }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: .3em .4em .3em 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink-3); font-weight: 600; font-size: .9em; border-top: 0; }
details.more { margin: .3em 0; } details.more summary { cursor: pointer; color: var(--ink-2); padding: .3em 0; }

/* ---- version 2: the picture, with the dashboard beside it (wide), below it (narrow), or on its own ---- */
.views { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.views button { padding: .25em .8em; font-size: .82em; color: var(--ink-2); min-height: 2.3em; border-left: 1px solid var(--line-2); }
.views button:first-child { border-left: 0; }
.views button[aria-pressed="true"] { background: var(--raise); color: var(--ink); font-weight: 650; }
.views .only-wide { display: none; }
@container pv (min-width: 1180px) { .views .only-wide { display: inline-block; } }
.key-btn { padding: .25em .75em; font-size: .82em; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 8px; min-height: 2.3em; }
.key-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-3); }
.badge.syn { color: var(--warn); border-color: var(--warn-line); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.2em; align-items: start; }
.stage[data-view="picture"] .dash, .stage[data-view="dash"] .pic { display: none; }
@container pv (min-width: 1180px) {
  .stage[data-view="both"] { grid-template-columns: minmax(0, 1fr) clamp(360px, 29%, 520px); gap: 1em; }
  .stage[data-view="both"] .dash { height: var(--stage-h, 80vh); overflow: auto; overscroll-behavior: contain; padding-right: .3em; }
}
.pic { position: relative; height: 70vh; min-height: 300px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.pic canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.pic canvas:focus-visible { outline: 2px solid var(--work); outline-offset: -2px; }
/* full screen (operator, 2026-10-13): only the picture, filling the screen with no scroll; the attention line stays,
   compact. The same rules serve the Fullscreen API and the fixed overlay used where it is missing. */
.fs-btn { display: inline-flex; align-items: center; gap: .4em; padding: .25em .75em; font-size: .82em; color: var(--ink-2);
  border: 1px solid var(--line-2); border-radius: 8px; min-height: 2.3em; }
.fs-btn .ic { width: 1.05em; height: 1.05em; flex: none; }
.fs-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }
.pv-host.pv-fs-fallback { position: fixed !important; inset: 0 !important; width: auto !important; height: auto !important;
  min-height: 0 !important; max-width: none !important; max-height: none !important; margin: 0 !important;
  border-radius: 0 !important; z-index: 2147483000 !important; }
.pv-host.pv-fs > :not(.pv):not(.detail) { display: none !important; }
.pv[data-fs] { overflow: hidden; }
.pv[data-fs] .pv-in { max-width: none; height: 100%; padding: 6px 10px 8px; display: flex; flex-direction: column; }
.pv[data-fs] .head { padding: 0 0 .35em; flex: none; }
.pv[data-fs] .views { display: none; }
.pv[data-fs] .attn { margin: .35em 0 .4em; flex: none; }
.pv[data-fs] .attn-h, .pv[data-fs] .attn-ok { margin: 0 0 .25em; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.pv[data-fs] .attn-h span, .pv[data-fs] .attn-sum { overflow: hidden; text-overflow: ellipsis; }
.pv[data-fs] .alert { grid-template-columns: auto auto minmax(0, 1fr) auto; padding: .2em .7em; margin: 0 0 .25em; }
.pv[data-fs] .alert .ic { grid-row: auto; }
.pv[data-fs] .alert-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55cqi; }
.pv[data-fs] .alert-s { grid-column: 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv[data-fs] .alert .go { grid-row: auto; grid-column: 4; }
.pv[data-fs] .attn-more { padding: .2em .7em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv[data-fs] .stage { display: block; flex: 1 1 auto; min-height: 0; }
.pv[data-fs] .dash { display: none !important; }
.pv[data-fs] .pic { min-height: 0; }
/* the board's full-board mode (operator, 2026-10-13): the dashboard, then the picture, side by side (board_patch.py).
   The board supplies the bar and the spacing around this box; type is a touch tighter, as on the board's columns. */
.pv[data-board] { overflow: hidden; background: transparent; }
.pv[data-board] .pv-in { max-width: none; padding: 0; font-size: var(--fb-type, 14px); }
.pv[data-board] .head { display: none; }
.pv[data-board] .attn { margin: 0 0 .55em; }
.pv[data-board] .attn-h, .pv[data-board] .attn-ok { margin: 0 0 .3em; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.pv[data-board] .attn-h span, .pv[data-board] .attn-sum { overflow: hidden; text-overflow: ellipsis; }
.pv[data-board] .alert { grid-template-columns: auto minmax(0, 1fr) auto; padding: .38em .7em; margin: 0 0 .35em; }
.pv[data-board] .alert .ic { grid-row: span 2; }
.pv[data-board] .alert-s { grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv[data-board] .alert .go { grid-row: 1 / span 2; grid-column: 3; }
.pv[data-board] .attn-more { padding: .3em .7em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv[data-board] .dash-h { display: block; margin: 0 0 .7em; }
.pv[data-board] .sec { margin: 0 0 1.2em; }
.pv[data-board] .pic { min-height: 0; border-radius: 10px; }
.pv[data-board="cols"] .pv-in { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(var(--fb-dash-min, 300px), var(--fb-dash, 32fr)) minmax(0, var(--fb-pic, 68fr)); column-gap: var(--fb-gap, 14px); }
.pv[data-board="cols"] .stage { display: contents; }
.pv[data-board="cols"] .attn { grid-column: 1; grid-row: 1; min-width: 0; }
.pv[data-board="cols"] .dash { grid-column: 1; grid-row: 2; height: auto !important; min-height: 0; min-width: 0; overflow-x: hidden;
  overflow-y: auto; overscroll-behavior: contain; padding-right: .35em; scrollbar-width: thin; }
.pv[data-board="cols"] .pic { grid-column: 2; grid-row: 1 / span 2; }
.pv[data-board="stack"] { position: static; overflow: visible; }
.pv[data-board="stack"] .stage { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 1em; }
.pv[data-board="stack"] .dash { order: -1; height: auto !important; overflow: visible; padding-right: 0; }
.pv[data-board="flat"], .pv[data-board="flat"] .pv-in, .pv[data-board="flat"] .stage { display: contents; }
.pv[data-board="flat"] .dash { height: auto !important; min-width: 0; }
.pv[data-board="flat"] .attn { min-width: 0; }
.dash { container: dash / inline-size; min-width: 0; }
.dash-h { font-size: .72em; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 .8em; }
.stage[data-view="dash"] .dash-h { display: none; }
.key { position: absolute; z-index: 4; right: .5em; top: .5em; width: min(380px, calc(100% - 1em)); max-height: calc(100% - 1em); overflow: auto;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: .7em .9em .8em; font-size: .86em; }
.key h3 { margin: 0 0 .5em; font-size: 1em; display: flex; justify-content: space-between; align-items: center; }
.key h3 button { color: var(--ink-2); font-size: 1.2em; min-width: 2em; min-height: 2em; }
.key dl { margin: 0; display: grid; grid-template-columns: 6.5em minmax(0,1fr); gap: .35em .7em; }
.key dt { color: var(--ink); font-weight: 600; }
.key dd { margin: 0; color: var(--ink-2); }
/* on a wide page each alert takes one line, so the picture stays in view */
@container pv (min-width: 900px) {
  .alert { grid-template-columns: auto auto minmax(0, 1fr) auto; padding: .45em .8em; }
  .alert .ic { grid-row: auto; }
  .alert-s { grid-column: 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert .go { grid-row: auto; grid-column: 4; }
}

@media (prefers-reduced-motion: reduce) {  /* no movement; what motion marked is held as a static mark instead */
  :where(.pv, .detail), :where(.pv, .detail) *, :where(.pv, .detail) *::before, :where(.pv, .detail) *::after {
    transition: none !important; animation: none !important; }
  .tput rect.new { fill: var(--ink); }
  .fin.arrive .fin-when { color: var(--work); }
}
@media (forced-colors: active) {
  .meter, .prog, .comb i, .seg i, .tc { border: 1px solid CanvasText; }
  .meter > i, .prog > i, .comb b, .seg i[data-s="reviewing"], .seg i[data-s="returned"], .tc::before { background: Highlight; forced-color-adjust: none; }
}
/* END processing_view.css */
/* BEGIN public full view */
/* the public page's Full view (operator, 2026-10-14): its project plan and framework summary, the Processing dashboard
   and its picture side by side, as one screen in the Processing view's visual language. Matches only what the public
   page's own script sets (tools/patch_public_board.py); nothing here applies on the private board. */
.pfb-btn { display:inline-flex; align-items:center; gap:6px; }
.pfb-btn svg, .pfb-bar svg { width:13px; height:13px; flex:none; }
#viz > .pfb-bar, #viz > .pfb-left { display:none; }
#viz.viz.pfb { --pfb-bg:#0f1216; --pfb-panel:#151a20; --pfb-line:#252c35; --pfb-line2:#333c47; --pfb-ink:#e8ecf1; --pfb-ink2:#aeb7c2;
  --pfb-ink3:#848f9c; --pfb-meter:#b4bcc6; --pfb-track:#232a33; --pfb-work:#3a9ad6; --pfb-warn:#e3a130;

  try { savedMode = localStorage.getItem(MODEKEY); } catch (e) {}
  if (savedMode === "3d") { mT = 1; me = 1; setMode(true, false); }
  setTab(saved === "proc" ? "proc" : "fw", false);
  poll(true);  // prefetch the map, so a transition has somewhere to land
  window.addEventListener("resize", function () { resize(); kick(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { poll(); kick(); } });
  setInterval(poll, 120000);
})();
</script>
<script>
(function () {  // the Project tab: the plan over the faded framework map
  var tabJ = document.getElementById("tab-project"), tabF = document.getElementById("tab-fw");
  var tabP = document.getElementById("tab-proc"), wrap = document.getElementById("viz"), view = document.getElementById("proj");
  if (!tabJ || !tabF || !tabP || !wrap || !view) return;
  var KEY = "lineagePublicView", TAG = { done: "Done", current: "In progress", future: "Planned" };
  var ST = { done: "done", running: "in progress", planned: "planned" }, last = "";
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function on() { return wrap.getAttribute("data-view") === "proj"; }
  function show(yes, persist) {
    if (yes) {
      if (wrap.getAttribute("data-tab") !== "fw") tabF.click();  // the map underneath is the framework view
      wrap.setAttribute("data-view", "proj");
    } else {
      wrap.removeAttribute("data-view");
    }
    view.hidden = !yes;
    tabJ.setAttribute("aria-selected", yes ? "true" : "false");
    if (yes) { tabF.setAttribute("aria-selected", "false"); tabP.setAttribute("aria-selected", "false"); }
    if (persist) { try { localStorage.setItem(KEY, yes ? "proj" : ""); } catch (e) {} }
  }
  // The framework view marks its own tab when a transition lands; keep the Project tab marked while it is shown.
  new MutationObserver(function () {
    if (on() && tabF.getAttribute("aria-selected") === "true") tabF.setAttribute("aria-selected", "false");
  }).observe(tabF, { attributes: true, attributeFilter: ["aria-selected"] });
  tabJ.addEventListener("click", function () { if (!on()) show(true, true); });
  tabF.addEventListener("click", function () { if (on()) show(false, true); });
  tabP.addEventListener("click", function () { if (on()) show(false, true); });
  function render(p) {
    var text = JSON.stringify(p);
    if (text === last) return;  // unchanged: keep the visitor's open and closed parts
    last = text;
    var parts = (p && p.parts) || [];
    document.getElementById("proj-steps").innerHTML = parts.map(function (x) {
      var t = x.tasks || [], d = t.filter(function (y) { return y.state === "done"; }).length;
      var f = x.state === "done" ? 1 : x.state === "current" ? (t.length ? d / t.length : 0) : 0;
      return '<span class="' + esc(x.state) + '" title="' + esc(x.name) + '"><i style="width:' + Math.round(100 * f)
        + '%"></i></span>';
    }).join("");
    var ms = (p && p.milestones) || [], dl = document.getElementById("proj-dates");  // the key dates, when published
    dl.innerHTML = ms.map(function (m) {
      return '<div class="k">' + esc(m.name) + '</div><div class="v"><span class="d">' + esc(m.when) + "</span>"
        + (m.range ? '<span class="r">' + esc(m.range) + "</span>" : "") + '</div><div>'
        + (m.basis ? '<span class="b">' + esc(m.basis) + "</span>" : "") + "</div>";
    }).join("");
    dl.hidden = !ms.length;
    document.getElementById("proj-body").innerHTML = parts.map(function (x, n) {
      var items = (x.tasks || []).map(function (y) {
        var st = esc(ST[y.state] || "") + (y.when && y.state !== "done" ? ' · <span class="w">' + esc(y.when) + "</span>" : "");
        return '<li class="' + esc(y.state) + '">' + esc(y.name) + '<span class="st">' + st + "</span></li>";
      }).join("");
      return '<details class="proj-part"' + (x.state === "current" ? " open" : "") + '><summary><span class="proj-hd"><span class="proj-name">'
        + (n + 1) + ". " + esc(x.name) + "</span>" + (x.when && x.state !== "done" ? '<span class="proj-when">' + esc(x.when) + "</span>" : "")
        + '</span><span class="proj-tag ' + esc(x.state) + '">' + esc(TAG[x.state] || "")
        + "</span></summary>" + (items ? "<ul>" + items + "</ul>" : "") + "</details>";
    }).join("");
    var u = p && p.updated_utc ? new Date(p.updated_utc) : null;
    document.getElementById("proj-foot").textContent = (u && !isNaN(u) ? "Plan updated "
      + u.toLocaleDateString([], { month: "short", day: "numeric" }) + ". " : "")
      + "Milestones only. Results stay private until they are reviewed." + (p && p.dates_note ? " " + p.dates_note : "");
    tabJ.hidden = !parts.length;
    if (!parts.length && on()) show(false, false);
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  function poll(first) {
    fetch(FEED + "project.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status);
      return r.json(); }).then(function (p) {
        render(p);
        if (first && saved === "proj" && !tabJ.hidden) show(true, false);
      }).catch(function () { if (!last) tabJ.hidden = true; });
  }
  poll(true);
  setInterval(poll, 600000);
})();
</script>
</body></html>
