<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineage Imperative live view</title>
<meta name="description" content="The Lineage Imperative v3 framework and the work running on it, live.">
<style>
:root { --bg:#05040b; --fg:#e6ecff; --muted:#9a9ab8; --line:#2a2740; --track:#2c2c2c; --run:#8ab4f8; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
body { padding:8px; box-sizing:border-box; }
button { font:inherit; font-size:13px; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:#0e0c1c;
  color:var(--fg); cursor:pointer; }

.viz { flex:1 1 0; min-width:380px; max-width:1000px; position:sticky; top:16px; }
.viz-bar { display:none; }
.viz-bar button { display:flex; width:100%; align-items:center; justify-content:space-between; gap:10px; text-align:left; }
#viz-mini { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.viz-tabs { display:flex; gap:6px; margin:0 0 8px; }
.viz-tabs button { flex:1; font-size:13px; padding:5px 10px; border-radius:8px; }
.viz-tabs button[aria-selected="true"] { border-color:var(--run); color:var(--run); font-weight:600; }
.viz[data-tab="proc"] #fw-canvas, .viz[data-tab="proc"] #fw-pop { display:none; }
.viz[data-tab="fw"] #viz-canvas, .viz[data-tab="fw"] #viz-pop { display:none; }
.viz-screen { position:relative; height:calc(100vh - 72px); min-height:420px; border-radius:10px; overflow:hidden;
  background:#05040b; border:1px solid var(--line); }
.viz-screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.viz-screen canvas.viz-trans { z-index:3; pointer-events:none; }
.fw-ctl { position:absolute; right:10px; bottom:8px; z-index:2; display:flex; gap:6px; }
.fw-ctl button { font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#cfe8ff; background:rgba(10,8,24,0.82);
  border:1px solid rgba(90,209,255,0.45); border-radius:8px; padding:5px 10px; cursor:pointer; }
.fw-ctl .fw-z { display:none; min-width:34px; }
.viz.fw3d .fw-ctl .fw-z { display:inline-block; }
.viz[data-tab="proc"] #fw-ctl { display:none; }
.viz-pop { position:absolute; z-index:2; box-sizing:border-box; width:max-content; max-width:min(330px, calc(100% - 16px)); background:rgba(9,8,22,0.95);
  border:1px solid rgba(90,209,255,0.45); border-radius:8px; padding:10px 12px; color:#e6ecff;
  font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; box-shadow:0 6px 24px rgba(0,0,0,0.55); }
.viz-pop { opacity:0; visibility:hidden; pointer-events:none; transform:scale(0.84);
  transition:opacity .16s ease, transform .2s cubic-bezier(.3,.7,.4,1), visibility 0s linear .2s; }
.viz-pop.open { opacity:1; visibility:visible; pointer-events:auto; transform:none;
  transition:opacity .16s ease, transform .24s cubic-bezier(.2,.9,.3,1.15), left .22s ease, top .22s ease, visibility 0s; }
@media (prefers-reduced-motion: reduce) { .viz-pop, .viz-pop.open { transform:none;
  transition:opacity .1s linear, visibility 0s linear .1s; } }
.viz-x { position:absolute; top:3px; right:4px; border:none; background:none; color:#9fb3ff; font-size:17px; line-height:1;
  padding:3px 7px; cursor:pointer; }
.vp-t { color:#5ad1ff; font-weight:700; margin:0 24px 6px 0; }
.vp-r { display:flex; gap:10px; margin:3px 0; } .vp-k { flex:none; width:112px; color:#8f96c0; }
.vp-v { flex:1; min-width:120px; overflow-wrap:anywhere; }
.vp-bar { display:block; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:3px; overflow:hidden; }
.vp-bar > span { display:block; height:100%; }
.vp-h { color:#8f96c0; margin:8px 0 2px; } .vp-j { margin:5px 0 0; } .vp-n { color:#a9b0d6; margin:2px 0 0; overflow-wrap:anywhere; }
.vp-warn { color:#f6bf60; font-weight:400; }
.viz { position:relative; top:auto; width:100%; max-width:none; min-width:0; flex:none; }
.viz-bar { display:none; }
.viz-tabs { align-items:center; flex-wrap:wrap; }
.viz-tabs button { flex:0 0 auto; min-width:120px; }
.pub-note { margin-left:auto; color:var(--muted); font-size:12px; }
.viz-screen { height:calc(100vh - 62px); min-height:380px; }
@media (max-width:560px) { .pub-note { margin-left:0; width:100%; } .viz-screen { height:calc(100vh - 86px); } }
</style></head><body>
<aside class="viz" id="viz" data-tab="fw" aria-label="Processing and framework views">
<div class="viz-bar"><button type="button" id="viz-toggle" aria-expanded="false" aria-controls="viz-screen">
<span id="viz-toggle-label">&#9656; Processing view</span><span id="viz-mini"></span></button></div>
<div class="viz-tabs" role="tablist"><button type="button" role="tab" id="tab-fw" aria-selected="true">Framework</button><button type="button" role="tab" id="tab-proc" aria-selected="false">Processing</button><span class="pub-note" id="pub-note">Live from the v3 work, updated every 10 minutes. Results stay sealed until reviewed.</span></div>
<div class="viz-screen" id="viz-screen"><canvas id="fw-canvas" role="img"
 aria-label="The framework as a citadel: what is online, in progress and still to do; tap any part for details"></canvas>
<div class="viz-pop" id="fw-pop" role="dialog" aria-live="polite"><button type="button" class="viz-x" id="fw-pop-x"
 aria-label="Close">&times;</button><div id="fw-pop-body"></div></div>
<div class="fw-ctl" id="fw-ctl"><button type="button" class="fw-z" id="fw-zoom-out" aria-label="Zoom out">&minus;</button><button
 type="button" class="fw-z" id="fw-zoom-in" aria-label="Zoom in">+</button><button type="button" id="fw-mode"
 aria-pressed="false">3D shells</button></div><canvas id="viz-canvas" role="img"
 aria-label="Animated view of both machines and the jobs in flight; tap a machine, thread, model or job for details"></canvas>
<div class="viz-pop" id="viz-pop" role="dialog" aria-live="polite"><button type="button" class="viz-x" id="viz-pop-x"
 aria-label="Close">&times;</button><div id="viz-pop-body"></div></div></div>
</aside>
<script>var FEED = 'feed/';</script>
<script>
(function () {  // the time of the last update, so a stalled feed is visible to visitors
  var el = document.getElementById("pub-note");
  function show(t) {
    var d = new Date(t * 1000), hm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var when = new Date().toDateString() === d.toDateString() ? hm : d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + hm;
    var stale = Date.now() / 1000 - t > 2700;  // three missed updates, allowing for the host's caching
    el.textContent = "Live from the v3 work, " + (stale ? "last updated " + when + " (updates paused)" : "updated " + when)
      + ". Results stay sealed until reviewed.";
  }
  function poll() {
    fetch(FEED + "meta.json", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (m) { if (m && m.built_epoch) show(m.built_epoch); }).catch(function () {});
  }
  poll();
  setInterval(poll, 60000);
})();
</script>
<script>
(function () {
  var wrap = document.getElementById("viz"), scr = document.getElementById("viz-screen");
  var cv = document.getElementById("viz-canvas"), btn = document.getElementById("viz-toggle");
  var lbl = document.getElementById("viz-toggle-label"), mini = document.getElementById("viz-mini");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var KEY = "lineageVizOpen";
  var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  var C = { cyan: "90,209,255", mag: "196,110,255", amber: "246,191,96", red: "255,110,110",
            green: "90,230,170", white: "230,236,255", grey: "130,130,165" };
  var STATE_COL = { running: C.cyan, waiting: C.grey, "needs-you": C.amber, problem: C.red };
  var MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  var W = 0, H = 0, DPR = 1, TOP = 60, BOT = 80, FS = 11, raf = 0, last = 0, clock = 0, busy = false;
  var data = null, hubs = { x2: hub("x2"), ws: hub("ws") }, clusters = {}, ambient = [], packets = [];
  var ticker = [], tickY = 0;
  var pop = document.getElementById("viz-pop"), popBody = document.getElementById("viz-pop-body"), sel = null;
  var models = { x2: { x: 0, y: 0, m: {} }, ws: { x: 0, y: 0, m: {} } };
  // A small brain (24 by 24 units): the outline, and its fissure and folds.
  var BRAIN = window.Path2D ? new Path2D("M12 4.5C10.8 3.2 8.6 3.3 7.6 4.8C5.6 4.6 4.2 6.2 4.6 8C3 8.8 2.6 11 3.6 12.3"
    + "C2.6 13.8 3.2 16 5 16.6C5.4 18.6 7.6 19.6 9.4 18.8C10.2 19.9 11.4 20.1 12 19.5C12.6 20.1 13.8 19.9 14.6 18.8"
    + "C16.4 19.6 18.6 18.6 19 16.6C20.8 16 21.4 13.8 20.4 12.3C21.4 11 21 8.8 19.4 8C19.8 6.2 18.4 4.6 16.4 4.8"
    + "C15.4 3.3 13.2 3.2 12 4.5Z") : null;
  var FOLDS = window.Path2D ? new Path2D("M12 4.5V19.5M7.6 4.8C8 6.2 9.6 6.8 10.6 6.2M4.6 8C5.8 8.9 7.4 8.6 8.4 9.8"
    + "M3.6 12.3C5 12.9 6.6 12.3 7.6 13.4M5 16.6C6.4 16.6 7.8 15.8 8.2 14.8M16.4 4.8C16 6.2 14.4 6.8 13.4 6.2"
    + "M19.4 8C18.2 8.9 16.6 8.6 15.6 9.8M20.4 12.3C19 12.9 17.4 12.3 16.4 13.4M19 16.6C17.6 16.6 16.2 15.8 15.8 14.8") : null;
  var flows = [], sparks = [], ringSel = null, ringA = 0;
  var stars = {}, starList = [], groupCenters = {}, grads = [], knownDone = null, budget = null, gauge = null;
  var tlHits = [], linkMid = null, linkAcc = [Math.random(), Math.random()];
  function brainScale() { return Math.max(1.15, Math.min(1.6, FS / 8)); }

  function hub(k) { return { key: k, x: 0, y: 0, r: 30, fan: 0, cpu: 0, mem: 0, threads: [], m: {}, fresh: true,
                             rot: Math.random() * 6.28 }; }
  function rgba(c, a) { return "rgba(" + c + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")"; }
  function ease(a, b, k) { return a + (b - a) * k; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(epoch) {
    var d = new Date(epoch * 1000), s = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.toDateString() !== new Date().toDateString()) s = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][d.getDay()] + " " + s;
    return s;
  }
  function num(n) { return Math.round(n).toLocaleString(); }
  function trunc(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
  function dot(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 6.2832); ctx.fill(); }
  function arc(x, y, r, a0, a1, stroke, w) {
    ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
  }
  function text(s, x, y, col, size, align, weight) {
    ctx.font = (weight || "500") + " " + size + "px " + MONO; ctx.textAlign = align || "left"; ctx.fillStyle = col;
    ctx.fillText(s, x, y);
  }

  // ---- open and collapse: narrow screens only (wide screens always show it) ----
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setOpen(open, persist) {
    wrap.classList.toggle("collapsed", !open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    lbl.textContent = (open ? "▾ " : "▸ ") + "Processing view";
    if (persist) { try { localStorage.setItem(KEY, open ? "1" : "0"); } catch (e) {} }
    if (!open) closePop();
    resize(); kick();
  }
  btn.addEventListener("click", function () { setOpen(wrap.classList.contains("collapsed"), true); });
  function shown() { return !document.hidden && cv.offsetWidth > 0 && cv.offsetHeight > 0; }

  // ---- geometry ----
  function resize() {
    var w = scr.clientWidth, h = scr.clientHeight;
    if (!w || !h) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    if (w === W && h === H && cv.width === Math.round(w * DPR)) return;
    W = w; H = h;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout(); seedAmbient();
  }
  function layout() {
    var m = Math.min(W, H), land = W > H * 1.05;
    FS = Math.max(9, Math.min(12, m / 52));
    TOP = W < 520 ? 46 : 64; BOT = Math.max(132, H * 0.22);
    var y0 = TOP, y1 = H - BOT;
    if (land) {
      hubs.x2.x = W * 0.3; hubs.x2.y = (y0 + y1) / 2; hubs.x2.fan = Math.PI;
      hubs.ws.x = W * 0.72; hubs.ws.y = (y0 + y1) / 2; hubs.ws.fan = 0;
    } else {
      hubs.x2.x = W * 0.5; hubs.x2.y = y0 + (y1 - y0) * 0.27; hubs.x2.fan = -Math.PI / 2;
      hubs.ws.x = W * 0.5; hubs.ws.y = y0 + (y1 - y0) * 0.76; hubs.ws.fan = Math.PI / 2;
    }
    var r = Math.max(15, m * 0.055);
    hubs.x2.r = r; hubs.ws.r = r * 0.9;
    [["x2", Math.PI * 0.22], ["ws", -Math.PI * 0.78]].forEach(function (e) {
      var h = hubs[e[0]], D = h.r * 2.05 + 36;
      models[e[0]].x = h.x + Math.cos(e[1]) * D; models[e[0]].y = h.y + Math.sin(e[1]) * D;
    });
    var gr = Math.max(16, Math.min(26, m * 0.035));
    gauge = { x: W - 14 - gr - 8, y: H - BOT - gr - 26, r: gr };
    starLayout(); slot(); closePop();
  }
  function seedAmbient() {
    var n = Math.max(12, Math.min(40, Math.round(W * H / 30000)));  // faint dust; the stars are finished items
    ambient = [];
    for (var i = 0; i < n; i++) {
      ambient.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 10,
                     vy: (Math.random() - 0.5) * 10, a: 0.25 + Math.random() * 0.5 });
    }
  }
  function threadPos(h, i) {
    var n = Math.max(1, h.threads.length), a = h.rot + i * 6.2832 / n, R = h.r * 2.05;
    return { x: h.x + Math.cos(a) * R, y: h.y + Math.sin(a) * R };
  }
  function separate(a, b, share) {  // push two axis-aligned boxes apart; share is a's part of the move
    var dx = a.px - b.px, dy = a.py - b.py, ox = a.hw + b.hw - Math.abs(dx), oy = a.hh + b.hh - Math.abs(dy);
    if (ox <= 0 || oy <= 0) return;
    if (ox < oy) { var s = (dx < 0 ? -1 : 1) * ox; a.px += s * share; b.px -= s * (1 - share); }
    else { var t = (dy < 0 ? -1 : 1) * oy; a.py += t * share; b.py -= t * (1 - share); }
  }
  function overlap(a, b) {
    var ox = a.hw + b.hw - Math.abs(a.px - b.px), oy = a.hh + b.hh - Math.abs(a.py - b.py);
    return ox > 0 && oy > 0 ? ox * oy : 0;
  }
  function angGap(a, b) { var d = Math.abs(a - b) % 6.2832; return d > Math.PI ? 6.2832 - d : d; }
  function slot() {
    if (!W || !H) return;
    // Hubs, with their thread ring and the line under them, are fixed obstacles; each job then takes the
    // clearest spot around its own hub, preferring the hub's outward side, and a short relaxation tidies up.
    var placed = ["x2", "ws"].map(function (k) {
      var h = hubs[k], R = h.r * 2.05;
      return { px: h.x, py: h.y + (FS + 12) / 2, hw: R + 8, hh: R + (FS + 12) / 2 + 8, fixed: true };
    }).concat(["x2", "ws"].map(function (k) {
      return { px: models[k].x, py: models[k].y + 14, hw: 50, hh: 40, fixed: true };
    })).concat(gauge ? [{ px: gauge.x, py: gauge.y + 8, hw: gauge.r + 26, hh: gauge.r + 18, fixed: true }] : []);
    var nodes = [];
    for (var id in clusters) nodes.push(clusters[id]);
    nodes.sort(function (a, b) { return (b.total != null) - (a.total != null) || (a.id < b.id ? -1 : 1); });
    nodes.forEach(function (c) {
      var h = hubs[c.machine], big = c.total != null, best = null, cost = Infinity;
      c.size = big ? Math.max(12, h.r * 0.62) : Math.max(4, h.r * 0.2);
      ctx.font = "600 " + (big ? FS : FS - 1) + "px " + MONO;
      c.hw = Math.max(c.size + 6, ctx.measureText(trunc(c.label, big ? 26 : 22)).width / 2 + 5);
      if (big) c.hw = Math.max(c.hw, ctx.measureText("00,000/00,000  → MON 00:00").width / 2 + 4);
      c.hh = big ? c.size + FS + 16 : c.size / 2 + FS / 2 + 6;
      var R0 = h.r * 2.05 + 14 + c.hh;
      for (var ri = 0; ri < 4; ri++) {
        for (var s = 0; s < 36; s++) {
          var ang = s * Math.PI / 18, R = R0 * (1 + ri * 0.28);
          var box = { px: h.x + Math.cos(ang) * R, py: h.y + Math.sin(ang) * R, hw: c.hw, hh: c.hh };
          if (box.px - c.hw < 6 || box.px + c.hw > W - 6 || box.py - c.hh < TOP || box.py + c.hh > H - BOT - 4) continue;
          var over = 0;
          placed.forEach(function (b) { over += overlap(box, b); });
          var k = over * 4 + angGap(ang, h.fan) * 120 + ri * 90;
          if (k < cost) { cost = k; best = box; }
        }
      }
      if (!best) best = { px: Math.max(c.hw + 6, Math.min(W - c.hw - 6, h.x)), py: (TOP + H - BOT) / 2 };
      c.px = best.px; c.py = best.py;
      if (c.x == null) { c.x = h.x; c.y = h.y; }
      placed.push(c);
    });
    for (var it = 0; it < 30; it++) {
      for (var i = 0; i < placed.length; i++) {
        for (var j = i + 1; j < placed.length; j++) {
          var a = placed[i], b = placed[j];
          if (a.fixed && b.fixed) continue;
          if (a.fixed) separate(b, a, 1); else if (b.fixed) separate(a, b, 1); else separate(a, b, 0.5);
        }
      }
    }
    nodes.forEach(function (c) {
      c.tx = Math.max(c.hw + 6, Math.min(W - c.hw - 6, c.px));
      c.ty = Math.max(TOP + c.hh, Math.min(H - BOT - c.hh - 4, c.py));
    });
  }

  // ---- data ----
  function apply(d) {
    data = d;
    ["x2", "ws"].forEach(function (k) {
      var m = (d.machines || {})[k] || {}, h = hubs[k], n = (m.threads || []).length;
      h.m = m; h.fresh = m.fresh !== false;
      while (h.threads.length < n) h.threads.push(0);
      h.threads.length = n;
    });
    var seen = {};
    (d.items || []).forEach(function (it) {
      var k = it.machine === "x2" ? "x2" : "ws", c = clusters[it.id];
      if (!c) c = clusters[it.id] = { id: it.id, x: null, y: null, lit: 0, pending: 0, flash: 0, acc: 0, back: 0,
                                        spin: Math.random() * 6.28, wave: 0, burst: 0 };
      if (c.done != null && it.done != null && it.done > c.done) {
        c.pending += Math.min(10, it.done - c.done); c.flash = 1; c.wave = 1;
        c.burst = it.total && it.done >= it.total ? 26 : Math.min(10, it.done - c.done);  // reaching 100% gets a big burst
      }
      c.done = it.done; c.total = it.total; c.rate = it.rate_h; c.eta = it.eta;
      c.label = it.label; c.state = it.state; c.machine = k; c.cpus = it.cpus || null;
      c.name = it.name; c.detail = it.detail; c.ai = it.ai || []; c.aiLive = it.ai_live || []; c.started = it.started;
      seen[it.id] = 1;
    });
    // Finished items are stars, permanently. A live ring that finishes graduates: it bursts and flies to its star.
    var doneIds = {};
    (d.done || []).forEach(function (e) { doneIds[e.id] = 1; });
    (d.done || []).forEach(function (e) {
      var st = stars[e.id];
      if (!st) {
        st = stars[e.id] = { id: e.id, flare: 0, grad: false, tw: 0.6 + 1.4 * hsh("t:" + e.id), ph: 6.2832 * hsh("p:" + e.id) };
        if (knownDone && !clusters[e.id]) st.flare = 1;  // finished elsewhere: it flares in where it belongs
      }
      st.label = e.label; st.name = e.name; st.machine = e.machine === "x2" ? "x2" : "ws"; st.group = e.group;
      st.done = e.done; st.started = e.started; st.detail = e.detail;
      var took = e.started && e.done ? Math.max(0, e.done - e.started) : 0;
      st.r = 1.1 + Math.min(1.6, Math.log10(1 + took / 600) * 0.8);
    });
    for (var sid in stars) if (!doneIds[sid]) delete stars[sid];
    starList = Object.keys(stars).map(function (k2) { return stars[k2]; }).sort(function (a, b) { return (a.done || 0) - (b.done || 0); });
    starLayout();
    for (var id in clusters) {
      if (seen[id]) continue;
      var gc = clusters[id];
      if (knownDone && doneIds[id] && gc.x != null && stars[id]) {
        burst(gc, 26);
        grads.push({ id: id, from: { x: gc.x, y: gc.y }, size: gc.size, col: STATE_COL[gc.state] || C.cyan, t: 0 });

        oc.save(); oc.globalAlpha = fade; oc.translate(w / 2, h / 2); oc.scale(sc, sc); oc.translate(-w / 2, -h / 2);
        oc.drawImage(snap, 0, 0, w, h); oc.restore();
      }
      oc.globalCompositeOperation = "lighter";
      flyers.forEach(function (f) {
        var k = Math.max(0, Math.min(1, (e - f.delay) / (1 - f.delay))), lift = Math.min(1, k / 0.2);
        var travel = ease(Math.max(0, Math.min(1, (k - 0.2) / 0.62))), settle = Math.max(0, (k - 0.82) / 0.18);
        var q = { x: (f.a.x + f.b.x) / 2 - (f.b.y - f.a.y) * f.bend, y: (f.a.y + f.b.y) / 2 + (f.b.x - f.a.x) * f.bend - 40 };
        var u = 1 - travel, x = u * u * f.a.x + 2 * u * travel * q.x + travel * travel * f.b.x;
        var y = u * u * f.a.y + 2 * u * travel * q.y + travel * travel * f.b.y - 10 * lift * (1 - travel);  // a small lift first
        var size = (f.a.s * (1 + 0.22 * lift)) * (1 - travel) + f.b.s * travel, col = travel < 0.5 ? f.a.col : f.b.col;
        f.trail.push({ x: x, y: y });
        if (f.trail.length > 14) f.trail.shift();
        f.trail.forEach(function (p, i) {
          oc.fillStyle = rgba(col, 0.05 + 0.25 * i / f.trail.length);
          oc.beginPath(); oc.arc(p.x, p.y, 1 + 1.5 * i / f.trail.length, 0, 6.2832); oc.fill();
        });
        var glow = (1 - settle) * f.dim;
        oc.fillStyle = rgba(col, 0.12 * glow); oc.beginPath(); oc.arc(x, y, size * 1.7, 0, 6.2832); oc.fill();
        var nd = 10;
        for (var i = 0; i < nd; i++) {  // the job's ring, carried along and turning
          var a2 = i * 6.2832 / nd + e * 6;
          oc.fillStyle = rgba(col, 0.75 * glow);
          oc.beginPath(); oc.arc(x + Math.cos(a2) * size, y + Math.sin(a2) * size, 1.4, 0, 6.2832); oc.fill();
        }
        oc.fillStyle = rgba(C.white, 0.9 * glow); oc.beginPath(); oc.arc(x, y, 1.5 + size * 0.18, 0, 6.2832); oc.fill();
        if (settle > 0 && !f.landed) {  // it lands: the part it settles into flares
          f.landed = true;
          if (to === "fw") f.node.flare = 1; else Pv.flash(f.id);
        }
      });
      oc.globalCompositeOperation = "source-over";
      if (e < 1) { requestAnimationFrame(tick); return; }
      oc.clearRect(0, 0, w, h); ov.style.display = "none"; transBusy = false;
    }
    requestAnimationFrame(tick);
    return true;
  }

  var saved = null;
  try { saved = localStorage.getItem(TABKEY); } catch (e) {}
  var savedMode = null;
  try { savedMode = localStorage.getItem(MODEKEY); } catch (e) {}
  if (savedMode === "3d") { mT = 1; me = 1; setMode(true, false); }
  setTab(saved === "proc" ? "proc" : "fw", false);
  poll(true);  // prefetch the map, so a transition has somewhere to land
  window.addEventListener("resize", function () { resize(); kick(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { poll(); kick(); } });
  setInterval(poll, 120000);
})();
</script>
